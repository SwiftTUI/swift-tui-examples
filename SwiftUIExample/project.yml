# XcodeGen spec for the SwiftUIExample native Apple app.
#
# `SwiftUIExample.xcodeproj` is GENERATED from this file and is still checked
# into source control, because org coordination tooling reads and rewrites the
# committed `project.pbxproj`:
#
#   * tools/coordination/materialize_pretag_overlay.sh rewrites the swift-tui
#     and swift-tui-swiftui package references from remote to local so pre-tag
#     integration builds against sibling checkouts.
#   * tools/bazel/version_coherence.sh and check_public_dependency_contracts.sh
#     audit the package URLs and pinned versions.
#   * tools/coordination/bump_version.sh stamps the release version into every
#     tracked file that carries it — including both this spec and the
#     generated project — so the two never drift.
#
# Regenerate after editing this file, or after adding/removing/renaming a file
# under SwiftUIExample/ (sources are enumerated at generate time, not globbed
# at build time), and commit the result:
#
#   cd swift-tui-examples/SwiftUIExample && xcodegen generate
#
# Do not hand-edit project.pbxproj: the next regenerate discards the change.

name: SwiftUIExample

options:
  minimumXcodeGenVersion: "2.45.0"
  # Matches the project's `defaultConfigurationName = Release`.
  defaultConfig: Release
  # Emits LastUpgradeCheck / LastSwiftUpdateCheck = 2640.
  xcodeVersion: "26.4"
  # Every build setting is declared below. XcodeGen's built-in presets are
  # frozen at an older Xcode template and would otherwise inject stale values
  # (CODE_SIGN_IDENTITY = "iPhone Developer", gnu++14, gnu11) and drift with
  # the generator version rather than with this spec.
  settingPresets: none

attributes:
  BuildIndependentTargetsInParallel: 1

configs:
  Debug: debug
  Release: release

packages:
  # Referenced at the project level but not linked by the app target: the
  # scenes come in through TerminalApp, which depends on swift-tui itself.
  # The reference pins the resolved version for the whole project graph, and
  # the pre-tag overlay REQUIRES it to be present — materialize_pretag_overlay.sh
  # fails with "missing local swift-tui package reference" without it.
  swift-tui:
    url: https://github.com/SwiftTUI/swift-tui.git
    exactVersion: 0.9.5
  swift-tui-swiftui:
    url: https://github.com/SwiftTUI/swift-tui-swiftui.git
    exactVersion: 0.9.5
  # Local package holding the reusable SwiftTUI scenes shared with other hosts.
  TerminalApp:
    path: TerminalApp

# Project-level build settings: the Xcode application template's analyzer and
# warning baseline, plus the org's signing team.
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    DEVELOPMENT_TEAM: 99FKXWHBZ8
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MTL_FAST_MATH: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule

# A SHARED scheme, unlike the project this replaces, which shipped none and so
# depended on Xcode auto-creating a per-user scheme into (gitignored)
# xcuserdata. The org examples gate builds this project with
# `xcodebuild -scheme SwiftUIExample -derivedDataPath ...`
# (Scripts/check_examples.sh), a combination xcodebuild rejects outright when no
# scheme resolves, so the scheme belongs in source control with the project.
schemes:
  SwiftUIExample:
    build:
      targets:
        SwiftUIExample: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftUIExampleUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  SwiftUIExample:
    type: application
    # Multiplatform app: one target, SDKROOT = auto. Not a Mac Catalyst build.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    attributes:
      CreatedOnToolsVersion: 26.4
    sources:
      - path: SwiftUIExample
    dependencies:
      # The native SwiftUI host view that embeds a SwiftTUI scene.
      - package: swift-tui-swiftui
        product: SwiftUIHost
      # The reusable SwiftTUI scenes, shared with the terminal and web hosts.
      - package: TerminalApp
        product: ExampleScenes
    # Identical in Debug and Release, matching the project being replaced.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 99FKXWHBZ8
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        # No Info.plist on disk: Xcode synthesizes it from INFOPLIST_KEY_*.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwiftTUI
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphoneos*]": UIStatusBarStyleDefault
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphonesimulator*]": UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "@executable_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: 26.0
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: llc.goodhats.SwiftUIExample
        PRODUCT_NAME: "$(TARGET_NAME)"
        REGISTER_APP_GROUPS: YES
        SDKROOT: auto
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        XROS_DEPLOYMENT_TARGET: 26.4

  SwiftUIExampleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: SwiftUIExampleUITests
    dependencies:
      - target: SwiftUIExample
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 99FKXWHBZ8
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        MACOSX_DEPLOYMENT_TARGET: 26.0
        PRODUCT_BUNDLE_IDENTIFIER: llc.goodhats.SwiftUIExampleUITests
        PRODUCT_MODULE_NAME: SwiftUIExampleUITests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: auto
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: SwiftUIExample
