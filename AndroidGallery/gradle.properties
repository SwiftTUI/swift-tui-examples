android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AGP is pinned to 9.2.1 (see build.gradle.kts) because that is the newest the
# current Android Studio will sync. compileSdk cannot drop below 37.1 to match:
# Compose 1.12.0 and the android-host AAR both stamp minCompileSdk=37 into their
# AAR metadata. Compiling one SDK ahead of the plugin is supported but warned
# about, so silence that one warning. Drop this line once Studio ships AGP 9.3.x
# and build.gradle.kts moves back up.
android.suppressUnsupportedCompileSdk=37.1

